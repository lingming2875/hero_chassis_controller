#!/usr/bin/env python

PACKAGE = "hero_chassis_controller"

from dynamic_reconfigure.parameter_generator_catkin import *


gen = ParameterGenerator()

wheels = [
    "front_left",
    "front_right",
    "back_left",
    "back_right",
]

for wheel in wheels:
    gen.add(
        wheel + "_p",
        double_t,
        0,
        wheel + " wheel PID proportional gain",
        2.0,
        0.0,
        100.0,
    )
    gen.add(
        wheel + "_i",
        double_t,
        0,
        wheel + " wheel PID integral gain",
        0.0,
        0.0,
        100.0,
    )
    gen.add(
        wheel + "_d",
        double_t,
        0,
        wheel + " wheel PID derivative gain",
        0.0,
        0.0,
        100.0,
    )
    gen.add(
        wheel + "_i_clamp",
        double_t,
        0,
        wheel + " wheel PID integral clamp",
        1.0,
        0.0,
        100.0,
    )

exit(gen.generate(PACKAGE, "hero_chassis_controller", "Pid"))
